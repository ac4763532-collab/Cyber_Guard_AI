# CyberGuard AI - Nginx Configuration
# Serves React frontend and proxies API requests to backend

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Root for static files
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests (LLM analysis)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # NOTE: there is no separate /ws/ location. The backend's actual
    # WebSocket route is mounted at /api/v1/ws (and /api/v1/ws/stats as a
    # plain GET), both under the same /api/v1 prefix as the REST API - see
    # backend/app/api/v1/ws.py and app/main.py's api_v1_prefix mount. The
    # /api/ block above already carries the Upgrade/Connection headers, so
    # it correctly proxies the WebSocket handshake without a dedicated
    # block. A previous /ws/ -> backend:8000/ws/ block was removed here
    # because that backend path does not exist (confirmed by reading the
    # router) - it was dead configuration, not a working alternate route.

    # Health check endpoint - proves nginx itself is up and serving traffic.
    # This does NOT check backend reachability or database/Redis/Redpanda
    # health. For actual dependency health, use the backend's own
    # /api/v1/health and /api/v1/health/detailed (proxied through /api/
    # above), not this endpoint.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
