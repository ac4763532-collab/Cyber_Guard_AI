# ============================================================================
# CyberGuard AI — Nginx Configuration
# ============================================================================
# 
# This Nginx config handles three critical things:
#   1. Serves the React static files (HTML, JS, CSS).
#   2. SPA Fallback: Redirects all unknown routes to index.html so that
#      React Router can handle them (e.g., refreshing /dashboard).
#   3. Reverse Proxy: Forwards /api requests to the FastAPI backend.
# ============================================================================

server {
    listen 80;
    server_name localhost;

    # The directory where Docker copied the React build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Gzip Compression ─────────────────────────────────────────────────
    # Compresses text assets before sending them to the browser.
    # This drastically reduces load times for the JS bundles.
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # ── SPA Routing (React Router) ───────────────────────────────────────
    # When a user refreshes the page at /dashboard, Nginx looks for a file
    # named "dashboard". It doesn't exist. So we tell Nginx: 
    # "If the file isn't found, just serve index.html and let React handle it."
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse Proxy (API) ──────────────────────────────────────────────
    # Any request starting with /api/ (e.g., /api/v1/auth/login) is forwarded
    # to the backend container on port 8000. Docker's internal DNS resolves
    # the hostname "backend" to the correct container IP.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        
        # Pass essential headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Prevent timeouts on long-running report generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # ── Static Asset Caching ─────────────────────────────────────────────
    # Vite generates hashed filenames (e.g., main-a1b2c3d4.js).
    # We tell the browser to cache these forever, since the hash changes
    # if the file contents change.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Security Headers ─────────────────────────────────────────────────
    # Protects against common web vulnerabilities.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # ── Error Pages ──────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}