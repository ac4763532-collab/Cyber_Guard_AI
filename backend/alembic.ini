# ============================================================================
# CyberGuard AI — Alembic Configuration
# ============================================================================
# This file configures Alembic, the database migration tool.
#
# Usage:
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic history
#   alembic current
#
# IMPORTANT: The database URL in this file is a PLACEHOLDER.
# The real URL is loaded from `settings.DATABASE_URL` by `alembic/env.py`,
# which reads the `.env` file. If you see the placeholder string
# "__CONFIGURED_IN_ENV_PY__" in an error, something is broken in env.py —
# do not try to fix it by editing this file.
# ============================================================================


# ============================================================================
# MAIN ALEMBIC CONFIGURATION
# ============================================================================

[alembic]
# Path to the migration scripts directory, relative to this file.
# Do NOT change unless you also rename the directory.
script_location = alembic

# Prepend the current directory to sys.path before loading env.py.
# This is REQUIRED so that `from app.models import ...` works inside
# env.py — without it, Python cannot find the `app` package.
prepend_sys_path = .

# Add the parent directory to sys.path as well. Some deployment layouts
# run alembic from the project root; this is a defensive measure.
# (When running from `backend/`, this line is harmless. When running from
# `E:\CyberGuard\`, it makes `backend/app` importable via the parent path.)
# prepend_sys_path = . backend

# Path separator for version files when multiple version directories exist.
# `os` uses the OS-native separator (`;` on Windows, `:` on Linux).
version_path_separator = os

# Truncate auto-generated slugs to this many characters.
# Prevents absurdly long filenames like
# `20250115_add_a_very_long_descriptive_message_that_goes_on_forever.py`.
truncate_slug_length = 40

# All timestamps in filenames are in UTC (the platform's convention).
timezone = UTC

# File naming template for new migrations. Produces names like:
#   20250115_1423_a1b2c3d4_initial_schema.py
#
# %(year)d_%(month).2d_%(day).2d_%(hour).2d%(minute).2d_%(rev)s_%(slug)s
#   year, month, day, hour, minute — when the revision was created
#   rev  — the short revision hash (8 chars by default)
#   slug — the -m message, slugified
#
# This ordering is chronologically sortable — `ls alembic/versions/` shows
# migrations in application order, which is what you want during debugging.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Optional: add `# type: ignore` header to generated files.
# Helpful if you run mypy on the codebase.
# rewriter = alembic.rewriter_pyproject_toml

# ─── DATABASE URL ──────────────────────────────────────────────────────────
# DECOY VALUE — DO NOT EDIT.
# The real URL is set programmatically in env.py from
# `app.core.config.settings.DATABASE_URL`. This placeholder exists only so
# that Alembic's config parser has something to read at startup. If you
# ever see "__CONFIGURED_IN_ENV_PY__" in an error message, it means env.py
# failed to override this URL — check env.py, not this line.
sqlalchemy.url = postgresql://__CONFIGURED_IN_ENV_PY__:__CONFIGURED_IN_ENV_PY__@localhost/__CONFIGURED_IN_ENV_PY__

# ─── POST-WRITE HOOKS ──────────────────────────────────────────────────────
# Optional auto-formatters for generated migration files. Uncomment to
# enable if the listed tools are installed.
#
# post_write_hooks =
#     console_scripts =
#         black = black -S -l 100
#         ruff = ruff format --line-length 100

# ─── MULTI-DB SUPPORT ──────────────────────────────────────────────────────
# Uncomment and edit if the project ever uses multiple databases (e.g. a
# read replica). Not currently needed.
#
# [databases]
# cyberguard = postgresql://...
# analytics   = postgresql://...


# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
# Alembic uses stdlib `logging.config`, NOT `app.core.logging`.
# This is deliberate: migration output is developer-facing, not structured.
# Keeping them separate means our JSON logging never leaks into migration
# output, and migration logging never appears in the app's JSON logs.
# ============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# ─── Logger: root ──────────────────────────────────────────────────────────
# Default level for everything not explicitly configured below.
# WARN keeps noisy third-party libraries quiet during migrations.
[logger_root]
level = WARN
handlers = console
qualname =

# ─── Logger: sqlalchemy.engine ─────────────────────────────────────────────
# INFO here would print every SQL statement executed during migration.
# That's useful when debugging a specific migration; it's overwhelming
# for routine runs. Override at the command line if needed:
#   alembic --log-level DEBUG upgrade head
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# ─── Logger: alembic ───────────────────────────────────────────────────────
# INFO shows "Running upgrade abc -> def" progress lines and any
# `print_op` output. Useful default.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# ─── Handler: console ──────────────────────────────────────────────────────
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# ─── Formatter: generic ────────────────────────────────────────────────────
# Simple text format — no timestamps (Alembic runs are short-lived).
# Alembic's own output has enough structure without extra verbosity.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S